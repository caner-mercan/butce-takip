<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Günlük Bütçe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <h1>Günlük Bütçe</h1>
    <div class="nav">
      <button id="prev" aria-label="Önceki gün">‹</button>
      <button id="today">Bugün</button>
      <button id="next" aria-label="Sonraki gün">›</button>
    </div>
  </div>

  <section class="hero" aria-live="polite">
    <div class="date" id="dlabel"></div>
    <div class="dial">
      <svg id="ticks" viewBox="0 0 240 240" aria-hidden="true"></svg>
      <div class="c"><div class="amt" id="left"></div><div class="lbl" id="leftlbl"></div></div>
    </div>
    <div class="stats">
      <div><b id="spent"></b><span>harcanan</span></div>
      <div><b id="bud"></b><span>günlük limit</span></div>
      <div><b id="carry"></b><span>devir</span></div>
    </div>
  </section>

  <div class="set">
    <label>Günlük limit (₺) <input id="budget" type="number" min="0" step="10" inputmode="decimal"></label>
    <label><input class="sw" id="roll" type="checkbox" role="switch"> Kalanı ertesi güne devret</label>
  </div>

  <form class="card" id="f">
    <h2>Harcama ekle</h2>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Tutar (₺)" required aria-label="Tutar">
      <input id="note" type="text" maxlength="60" placeholder="Not (isteğe bağlı)" aria-label="Not">
      <button class="add" type="submit">Ekle</button>
    </div>
  </form>

  <section class="card">
    <h2>Bu günün harcamaları</h2>
    <ul id="list"></ul>
  </section>

  <section class="card">
    <h2 id="mtitle"></h2>
    <div class="cal" id="cal"></div>
    <div class="ms">
      <div><b id="mtot"></b><span>ay toplamı</span></div>
      <div><b id="mavg"></b><span>günlük ortalama</span></div>
      <div><b id="mok"></b><span>limit altı gün</span></div>
    </div>
    <div class="stack" id="stack"></div>
    <div class="leg" id="leg"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
